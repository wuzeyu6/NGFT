### model
model_name_or_path: Qwen/Qwen2.5-0.5B-Instruct
trust_remote_code: true
zero_mask: 0
fine_loss: 0
#finetune_class: "BioInstruct_Qwen2.5-0.5B-Instruct_0.01"

### method
stage: sft
do_train: true
finetuning_type: full
#freeze_trainable_layers: 100
#freeze_trainable_modules: 'mlp'
#deepspeed: examples/deepspeed/ds_z3_config.json  # choices: [ds_z0_config.json, ds_z2_config.json, ds_z3_config.json]

### dataset
dataset: gsm_Qwen2.5-0.5B-Instruct_0.10
template: qwen
cutoff_len: 4096
# max_samples: 1000
overwrite_cache: true
preprocessing_num_workers: 16

### output
output_dir: model_result/neuron_5.00/gsm_Qwen2.5-0.5B-Instruct_0.10
logging_steps: 1
save_steps: 0
plot_loss: true
# overwrite_output_dir: true
save_total_limit: 1

### train
per_device_train_batch_size: 4
gradient_accumulation_steps: 1
learning_rate: 2.0e-5
num_train_epochs: 4.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
weight_decay: 0.1
bf16: true
ddp_timeout: 180000000
